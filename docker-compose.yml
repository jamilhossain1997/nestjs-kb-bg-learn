version: "3.1"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: karbon_user
      POSTGRES_PASSWORD: karbon_password
      POSTGRES_DB: karbon_db_learn_nest

    ports:
      - "5432:5432"

    volumes:
      - kb_db_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U karbon_user -d karbon_db_learn_nest"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: "postgresql://karbon_user:karbon_password@db:5432/karbon_db_learn_nest?schema=public"
      JWT_SECRET: "change-this-secret-in-production"
      JWT_EXPIRES_IN: "1d"
      PORT: 4000
      CORS_ORIGIN: "http://localhost:3000"

    ports:
      - "4000:4000"

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run start:dev

volumes:
  kb_db_data: